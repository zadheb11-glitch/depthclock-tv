var TOP=310, DH=436.5, CX=960, last="", idx=0, XL="http://www.w3.org/1999/xlink", NS="http://www.w3.org/2000/svg", tmr=null;
function setHref(el,u){el.setAttribute("href",u);el.setAttributeNS(XL,"href",u);}
function draw(force){
  var d=new Date(), h=d.getHours()%12; if(h===0) h=12;
  var mi=d.getMinutes(), m=(mi<10?"0":"")+mi, s=h+":"+m;
  if(s===last&&!force) return; last=s;
  var tw=0,i; for(i=0;i<s.length;i++) tw+=G[s.charAt(i)].w;
  var x=CX-tw/2, host=document.getElementById("clock");
  while(host.firstChild) host.removeChild(host.firstChild);
  for(i=0;i<s.length;i++){
    var g=G[s.charAt(i)], p=document.createElementNS(NS,"path");
    p.setAttribute("transform","translate("+x.toFixed(1)+" "+(TOP+DH).toFixed(1)+")");
    p.setAttribute("d",g.d); host.appendChild(p); x+=g.w;
  }
}
function show(i,announce){
  idx=((i%SC.length)+SC.length)%SC.length;
  var s=SC[idx];
  setHref(document.getElementById("bg"),s.bg);
  setHref(document.getElementById("fg"),s.fg);
  document.getElementById("clock").setAttribute("fill",s.ink);
  if(announce){
    var l=document.getElementById("label");
    l.textContent="\u25C0  "+s.name+"  ("+(idx+1)+"/"+SC.length+")  \u25B6";
    l.className="on"; if(tmr) clearTimeout(tmr);
    tmr=setTimeout(function(){l.className="";},2600);
  }
}
window.nextScene=function(d){
  show(idx+d,true);
  try{ if(window.AndroidBridge) window.AndroidBridge.save(idx); else localStorage.setItem("depthclock.scene",String(idx)); }catch(e){}
};
(function(){
  var n=parseInt((location.hash||"").slice(1),10);
  if(isNaN(n)){ try{ n=parseInt(localStorage.getItem("depthclock.scene"),10); }catch(e){} }
  if(isNaN(n)) n=0;
  show(n,true); try{draw(true);}catch(e){}
})();
setInterval(function(){try{draw(false);}catch(e){}},1000);
document.addEventListener("keydown",function(e){
  var k=e.keyCode;
  if(k===37) window.nextScene(-1);
  else if(k===39||k===13||k===32) window.nextScene(1);
});
document.addEventListener("click",function(){window.nextScene(1);});
</script>
